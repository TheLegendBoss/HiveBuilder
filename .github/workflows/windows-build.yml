name: Windows build

# Run by hand (Actions tab, Run workflow) to get the exe as a downloadable artifact.
# Push a version tag such as v0.0.2 to also publish it on the Releases page.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build portable exe
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: HiveDeck-windows-portable
          path: release/*.exe
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.exe \
            --title "Hive Deck $GITHUB_REF_NAME (Windows portable)" \
            --notes "Portable Windows app, no install. Not code signed: if SmartScreen warns, choose More info, then Run anyway. F11 toggles fullscreen."
